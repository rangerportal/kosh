<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Kosh Money Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B1412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kosh">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column, sticky top bar, faceted "gem" balance card,
   bottom tab bar + floating add button. Gem colours encode money flow:
   emerald = credit (in), garnet = debit (out), amethyst = expense, gold = accent. */
:root{
  --bg:#0B1412; --surface:#121E1B; --surface-2:#192824; --line:#253A34;
  --fg:#E9F0EC; --muted:#8EA29A; --gold:#D9B66A; --gold-ink:#1A1405;
  --credit:#4FD1A1; --debit:#F2836B; --expense:#B99BF5;
  --card-a:#0F3B30; --card-b:#06201A; --card-fg:#F2F6F3;
  --shadow:0 18px 40px -18px rgba(0,0,0,.6);
  --f-display:"Bricolage Grotesque","Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:11px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EFF3F0; --surface:#FFFFFF; --surface-2:#F4F7F5; --line:#DCE5E0;
  --fg:#10201B; --muted:#5B6F68; --gold:#9C7426; --gold-ink:#FFFFFF;
  --credit:#0B8F62; --debit:#C8462F; --expense:#6E4FCB;
  --card-a:#0F4A3B; --card-b:#082A22; --card-fg:#F2F6F3;
  --shadow:0 16px 34px -20px rgba(16,32,27,.35);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#EFF3F0; --surface:#FFFFFF; --surface-2:#F4F7F5; --line:#DCE5E0;
  --fg:#10201B; --muted:#5B6F68; --gold:#9C7426; --gold-ink:#FFFFFF;
  --credit:#0B8F62; --debit:#C8462F; --expense:#6E4FCB;
  --card-a:#0F4A3B; --card-b:#082A22; --card-fg:#F2F6F3;
  --shadow:0 16px 34px -20px rgba(16,32,27,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* ---------- Auth ---------- */
.auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:32px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.gem{width:44px;height:44px;flex:none}
.brand h1{font-size:28px}
.brand p{margin:0;color:var(--muted);font-size:13px}
.auth h2{font-size:26px;margin-bottom:6px}
.auth .lead{color:var(--muted);margin:0 0 22px}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--gold)}
.prefix{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.prefix:focus-within{border-color:var(--gold)}
.prefix span{display:flex;align-items:center;padding:0 12px;border-right:1px solid var(--line);color:var(--muted);font-weight:600}
.prefix input{flex:1;min-width:0;border:0;background:transparent;padding:13px 14px;outline:none}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:8px}
.meter{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:2px}
.meter b{display:block;height:100%;width:0;transition:width .25s,background .25s}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--debit);font-size:13px;min-height:18px;margin:2px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-sm);padding:14px 18px;font-weight:700;background:var(--gold);color:var(--gold-ink);width:100%;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--debit);border:1px solid color-mix(in srgb,var(--debit) 40%,transparent)}
.btn[disabled]{opacity:.55;pointer-events:none}
.row{display:flex;gap:10px}
.switch{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.link{background:none;border:0;color:var(--gold);font-weight:700;padding:4px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}

/* ---------- App shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:14px}
.top h1{font-size:22px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--gold);font-family:var(--f-display)}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:18px;padding-block:6px 20px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--fg)}
.tab.on svg{color:var(--gold)}
.fab{justify-self:center;width:56px;height:56px;border-radius:18px;border:0;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--gold) 70%,transparent)}
.fab svg{width:26px;height:26px}

/* ---------- Balance card (the one bold moment) ---------- */
.vault{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 18px;color:var(--card-fg);background:
  radial-gradient(120% 80% at 100% 0%,rgba(217,182,106,.22),transparent 55%),
  linear-gradient(155deg,var(--card-a),var(--card-b));box-shadow:var(--shadow)}
.vault::before{content:"";position:absolute;inset:0;background:
  conic-gradient(from 210deg at 82% 18%,rgba(255,255,255,.10) 0 12deg,transparent 12deg 40deg,rgba(255,255,255,.06) 40deg 58deg,transparent 58deg 110deg,rgba(255,255,255,.08) 110deg 124deg,transparent 124deg);pointer-events:none}
.vault::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(217,182,106,.35);pointer-events:none}
.vault>*{position:relative}
.vault .eyebrow{color:rgba(242,246,243,.7)}
.vault .bal{font-family:var(--f-display);font-size:clamp(32px,10vw,42px);font-weight:700;margin:6px 0 2px;letter-spacing:-.03em}
.vault .sub{font-size:12px;color:rgba(242,246,243,.7)}
.vault .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(242,246,243,.14)}
.vault .trio div{min-width:0}
.vault .trio span{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(242,246,243,.72)}
.vault .trio b{display:block;font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);flex:none}
.dot.c{background:#5FE0B0}.dot.d{background:#FF9A82}.dot.e{background:#C9B0FF}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left}
.qa i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.qa i svg{width:18px;height:18px}
.qa b{font-size:14px}
.qa small{font-size:11px;color:var(--muted);margin-top:-6px}
.t-credit{color:var(--credit)}.t-debit{color:var(--debit)}.t-expense{color:var(--expense)}
.bg-credit{background:color-mix(in srgb,var(--credit) 16%,transparent);color:var(--credit)}
.bg-debit{background:color-mix(in srgb,var(--debit) 16%,transparent);color:var(--debit)}
.bg-expense{background:color-mix(in srgb,var(--expense) 18%,transparent);color:var(--expense)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between}
.sec-h h3{font-size:17px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.month{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.month div{background:var(--surface);padding:12px 14px}
.month span{font-size:12px;color:var(--muted)}
.month b{display:block;font-size:17px;margin-top:2px}

/* ---------- Transaction list ---------- */
.list{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left}
.list .tx:first-child{border-top:0}
.tx i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.tx i svg{width:18px;height:18px}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;white-space:nowrap}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;padding:0 4px 6px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:17px;margin-bottom:4px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:40px}

/* ---------- Reports ---------- */
.period{display:flex;align-items:center;justify-content:space-between;gap:10px}
.period b{font-family:var(--f-display);font-size:16px;text-align:center;flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn[disabled]{opacity:.35}
.custom{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:18px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.net{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.kpi.net b{margin:0}
.chart{padding:14px 12px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:2px 4px 8px}
.chart .legend span{display:flex;align-items:center;gap:6px}
.ax{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.grid{stroke:var(--line);stroke-width:1}
.cats{padding:6px 14px 12px}
.cat{padding:10px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.cat .l span{color:var(--muted);font-size:12px;margin-left:6px}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar b{display:block;height:100%;border-radius:6px;background:var(--expense)}

/* ---------- Profile ---------- */
.who{display:flex;align-items:center;gap:14px;padding:16px}
.who .avatar{width:54px;height:54px;font-size:22px}
.who h2{font-size:20px}
.menu{display:flex;flex-direction:column}
.mi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.menu .mi:first-child{border-top:0}
.mi span{font-weight:600}
.mi small{color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(3,8,7,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;margin-bottom:14px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:4px;border-radius:14px;margin-bottom:16px}
.types button{border:0;background:none;border-radius:10px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.types button.on.credit{background:var(--credit);color:#04140E}
.types button.on.debit{background:var(--debit);color:#1C0802}
.types button.on.expense{background:var(--expense);color:#140A2E}
.amount{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);padding:4px 2px 8px;margin-bottom:16px}
.amount:focus-within{border-color:var(--gold)}
.amount span{font-family:var(--f-display);font-size:30px;color:var(--muted)}
.amount input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:var(--f-display);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.catgrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.catgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.catgrid button.on{border-color:var(--gold);color:var(--fg);background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm p{color:var(--muted);margin:0 0 18px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);animation:up .2s ease}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.offline i{width:6px;height:6px;border-radius:50%;background:var(--credit)}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.toast{animation-name:toastIn}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
"use strict";
/* ================= Icons ================= */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M7 8v9h9"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',

const fail = (e, fallback) => {
  const c = (e && e.code) || '';
  if (c.includes('network') || c === 'unavailable' || /offline/i.test(e && e.message || '')) return 'No internet connection. This step needs internet. Connect and try again.';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'Incorrect username, mobile or password.';
  if (c.includes('too-many-requests')) return 'Too many attempts. Wait a few minutes and try again.';
  if (c.includes('email-already-in-use')) return 'That username is taken. Go back and choose another.';
  if (c.includes('permission-denied')) return 'This mobile number or username already has an account.';
  if (c.includes('operation-not-allowed')) return 'Email/Password sign-in is not enabled in Firebase Authentication.';
  return fallback || ('Something went wrong: ' + (e && e.message || 'unknown error'));
};
// Batched writes (max 450 per batch). Not awaited when offline: Firestore queues them.
function writeMany(ops){
  for (let i = 0; i < ops.length; i += 450){
    const b = fs.batch();
    ops.slice(i, i+450).forEach(fn => fn(b));
    b.commit().catch(e => toast(fail(e, 'Some changes could not sync.')));
  }
}

/* Entries saved by the first, phone-only version of Kosh (IndexedDB "kosh-db") */
function readOldLocal(){
  return new Promise(res => {
    try{
      const r = indexedDB.open('kosh-db');
      r.onupgradeneeded = () => { r.transaction.abort(); };
      r.onerror = () => res([]);
      r.onsuccess = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('txns')){ db.close(); return res([]); }
        const tx = db.transaction(['users','txns'], 'readonly');
        const ug = tx.objectStore('users').getAll(), tg = tx.objectStore('txns').getAll();
        tx.oncomplete = () => {
          const demo = new Set(ug.result.filter(u => u.demo || u.username === 'demo').map(u => u.id));
          db.close(); res(tg.result.filter(t => !demo.has(t.userId)));
        };
        tx.onerror = () => { db.close(); res([]); };
      };
    }catch(e){ res([]); }
  });
}

function pwScore(pw){
  let s = 0;
  if (pw.length >= 8) s++; if (pw.length >= 12) s++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
  if (/\d/.test(pw)) s++; if (/[^A-Za-z0-9]/.test(pw)) s++;
  return Math.min(s, 4);
}

/* ================= Session & live sync ================= */
let unsubTx = null, unsubProf = null;
function stopSync(){ if (unsubTx) unsubTx(); if (unsubProf) unsubProf(); unsubTx = unsubProf = null; }

function startSession(fu, msg){
  stopSync();
  S.screen = 'app';
  S.user = {uid:fu.uid, username:(fu.email||'').split('@')[0], name:'', mobile:'', created: Date.parse(fu.metadata && fu.metadata.creationTime) || Date.now()};
  S.ready = false; S.view = 'home'; S.txns = []; S.oldLocal = [];
  renderLoading();
  unsubProf = userDoc().onSnapshot(d => { if (d.exists){ Object.assign(S.user, d.data()); if (S.ready) safeRender(); } }, () => {});
  unsubTx = txCol().onSnapshot({includeMetadataChanges:true}, snap => {
    S.pending = snap.metadata.hasPendingWrites;
    const changed = !S.ready || snap.docChanges().length > 0;
    if (changed) S.txns = snap.docs.map(d => ({id:d.id, ...d.data()}));
    const first = !S.ready; S.ready = true;
    if (changed) safeRender(); else updateBadge();
    if (first && msg) toast(msg);
  }, e => toast(fail(e, 'Could not load your entries.')));
  readOldLocal().then(list => {
    try{ if (localStorage.getItem('kosh.moved.' + fu.uid)) return; }catch(e){}
    S.oldLocal = list; if (list.length && S.ready && S.view === 'home') safeRender();
  });
}

/* ================= Reports ================= */
function reportRange(){
  const {preset, off} = S.rp, t = today(), y = t.getFullYear(), m = t.getMonth();
  if (preset === 'week'){
    const dow = (t.getDay()+6)%7; const s = addDays(t, -dow + off*7);
    return {a:s, b:addDays(s,6), label: `${s.getDate()} ${MON[s.getMonth()]} – ${addDays(s,6).getDate()} ${MON[addDays(s,6).getMonth()]}`, unit:'day'};
  }
  if (preset === 'month'){ const s = new Date(y, m+off, 1); return {a:s, b:new Date(y, m+off+1, 0), label:`${MON[s.getMonth()]} ${s.getFullYear()}`, unit:'day'}; }
  if (preset === '6m'){ const s = new Date(y, m+off*6-5, 1), e = new Date(y, m+off*6+1, 0); return {a:s, b:e, label:`${MON[s.getMonth()]} ${s.getFullYear()} – ${MON[e.getMonth()]} ${e.getFullYear()}`, unit:'month'}; }
  if (preset === 'year'){ const s = new Date(y, m+off*12-11, 1), e = new Date(y, m+off*12+1, 0); return {a:s, b:e, label:`${MON[s.getMonth()]} ${s.getFullYear()} – ${MON[e.getMonth()]} ${e.getFullYear()}`, unit:'month'}; }
  let a = S.rp.from ? parse(S.rp.from) : new Date(y, m, 1), b = S.rp.to ? parse(S.rp.to) : t;
  if (a > b) [a, b] = [b, a];
  const days = Math.round((b - a)/864e5) + 1;
  return {a, b, label:`${fmtDate(ymd(a))} – ${fmtDate(ymd(b))}`, unit: days <= 31 ? 'day' : days <= 120 ? 'week' : 'month'};
}
function buckets(r, list){
  const out = [];
  if (r.unit === 'day'){
    for (let d = new Date(r.a); d <= r.b; d = addDays(d,1)) out.push({a:ymd(d), b:ymd(d), lbl: String(d.getDate())});
  } else if (r.unit === 'week'){
    for (let d = new Date(r.a); d <= r.b; d = addDays(d,7)){ const e = addDays(d,6) > r.b ? r.b : addDays(d,6); out.push({a:ymd(d), b:ymd(e), lbl:`${d.getDate()} ${MON[d.getMonth()]}`}); }
  } else {
    for (let d = new Date(r.a.getFullYear(), r.a.getMonth(), 1); d <= r.b; d = new Date(d.getFullYear(), d.getMonth()+1, 1)){
      const e = new Date(d.getFullYear(), d.getMonth()+1, 0);
      out.push({a: ymd(d < r.a ? r.a : d), b: ymd(e > r.b ? r.b : e), lbl: MON[d.getMonth()]});
    }
  }
  out.forEach(k => Object.assign(k, totals(inRange(list, k.a, k.b))));
  return out;
}
function chartSVG(bs){
  const W = 340, H = 190, L = 34, R = 6, T = 10, B = 24, cw = W-L-R, ch = H-T-B;
  const max = Math.max(1, ...bs.map(b => Math.max(b.credit, b.out)));
  const step = niceStep(max/3); const top = Math.ceil(max/step)*step;
  const y = v => T + ch - (v/top)*ch;
  const n = bs.length, slot = cw/n, bw = Math.max(1.5, Math.min(14, slot*0.36));
  const every = n > 16 ? Math.ceil(n/8) : 1;
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+3}" text-anchor="end">${shortInr(v).replace('₹','')}</text>`;
  bs.forEach((b,i) => {
    const cx = L + slot*i + slot/2;
    if (b.credit) g += `<rect x="${cx-bw-0.5}" y="${y(b.credit)}" width="${bw}" height="${Math.max(1, T+ch-y(b.credit))}" rx="${Math.min(3,bw/2)}" fill="var(--credit)"><title>${b.lbl}: credit ${inr(b.credit)}</title></rect>`;
    if (b.out) g += `<rect x="${cx+0.5}" y="${y(b.out)}" width="${bw}" height="${Math.max(1, T+ch-y(b.out))}" rx="${Math.min(3,bw/2)}" fill="var(--debit)"><title>${b.lbl}: spent ${inr(b.out)}</title></rect>`;
    if (i % every === 0) g += `<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${b.lbl}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Credit versus money out per period">${g}</svg>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const f = x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

function viewReports(){

      ${list.length ? chartSVG(bs) : '<div class="empty"><b>No entries in this period</b>Pick another period or add an entry.</div>'}
    </section>
    <section>

      ${list.length>50?`<p class="hint" style="text-align:center">Showing latest 50 of ${list.length}. The CSV export includes all.</p>`:''}

  if ($('#prev')){ $('#prev').onclick = () => { rp.off--; viewReports(); }; $('#next').onclick = () => { if (rp.off<0){ rp.off++; viewReports(); } }; }

  $('#csv').onclick = () => downloadCSV(sorted(list), `kosh-report-${ymd(r.a)}-to-${ymd(r.b)}.csv`);

function downloadCSV(list, name){
  const rows = [['Date','Type','Category','Note','Mode','Amount']].concat(list.map(t => [t.date, TYPE_LABEL[t.type], t.category, t.note||'', t.mode||'', (t.type==='credit'?'':'-') + t.amount]));
  saveFile(rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'), name, 'text/csv');
}
function saveFile(text, name, type){
  try{
    const url = URL.createObjectURL(new Blob(['﻿'+text], {type}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Saved ' + name);
  }catch(e){ toast('Downloads are blocked here. Install the app to export.'); }
}

function changePw(){
  const sc = sheet(`<h3>Change password</h3>

      <div class="field"><label for="c0">Current password</label><input class="input" type="password" id="c0" autocomplete="current-password"></div>

      <div class="field"><label for="c2">Confirm new password</label><input class="input" type="password" id="c2" autocomplete="new-password"></div>
      <div class="err" id="cerr"></div>
      <button class="btn" id="cbtn">Update password</button></form>`);
  sc.querySelector('#cf').onsubmit = async e => {
    e.preventDefault();
    const err = m => sc.querySelector('#cerr').textContent = m;
    const c0 = sc.querySelector('#c0').value, c1 = sc.querySelector('#c1').value, c2 = sc.querySelector('#c2').value;
    if (c1.length < 8 || !/\d/.test(c1)) return err('New password needs at least 8 characters including a number.');
    if (c1 !== c2) return err('The new passwords do not match.');
    sc.querySelector('#cbtn').disabled = true;
    try{
      const cu = auth.currentUser;
      await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email, c0));

function confirmSheet(title, msg, label, fn){

  }
  sc.querySelectorAll('[data-ty]').forEach(b => b.onclick = () => { f.type = b.dataset.ty; paint(); });
  q('#tamt').oninput = e => { let v = e.target.value.replace(/[^\d.]/g,''); const p = v.split('.'); if (p.length>2) v = p[0]+'.'+p.slice(1).join(''); if (p[1]&&p[1].length>2) v = p[0]+'.'+p[1].slice(0,2); e.target.value = v; };
  paint();
  if (!edit) setTimeout(() => q('#tamt').focus(), 60);
  q('#tf').onsubmit = async e => {
    e.preventDefault();
    const amount = Math.round(parseFloat(q('#tamt').value)*100)/100;
    if (!(amount > 0)) return q('#terr').textContent = 'Enter an amount greater than zero.';
    if (amount > 1e10) return q('#terr').textContent = 'That amount is too large.';
    const date = q('#tdate').value; if (!date) return q('#terr').textContent = 'Pick a date.';
    const t = {type:f.type, category:f.category, amount, date, note:q('#tnote').value.trim(), mode:q('#tmode').value, id: f.id || uid(), created: f.created || Date.now(), updated: Date.now()};
    const {id, ...data} = t;
    txCol().doc(id).set(data).catch(e => toast(fail(e, 'Could not save this entry.')));
    S.txns = S.txns.filter(x => x.id !== t.id).concat(t);
    closeSheet(); render();
    toast(edit ? 'Entry updated' : `${TYPE_LABEL[t.type]} of ${inr(t.amount)} added`);
  };
  if (edit) q('#tdel').onclick = () => confirmSheet('Delete this entry?', `${TYPE_LABEL[tx.type]} of ${inr(tx.amount)} on ${fmtDate(tx.date)} will be removed.`, 'Delete', async () => {
    txCol().doc(tx.id).delete().catch(e => toast(fail(e, 'Could not delete this entry.'))); S.txns = S.txns.filter(x => x.id !== tx.id); render(); toast('Entry deleted');
  });
}

/* ================= Boot ================= */
addEventListener('online', updateBadge);
addEventListener('offline', updateBadge);
if (FB_OK){
  renderLoading();
  auth.onAuthStateChanged(fu => {
    if (S.signingUp) return;
    if (fu){ if (!S.user || S.user.uid !== fu.uid) startSession(fu); }
    else { stopSync(); S.user = null; if (S.screen !== 'signup') renderLogin(); }
  });
} else renderLogin();
if ('serviceWorker' in navigator){
  addEventListener('load', () => { try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} });
}
</script>
</body>
</html>
